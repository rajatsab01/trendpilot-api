services:
  - type: web
    name: trendpilot
    env: node
    region: oregon
    plan: free

    buildCommand: |
      npm install
      npm run build

    startCommand: node dist/index.cjs

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

    # Required for production persistence (accounts + saved analyses).
    # Add it in Render -> Web Service -> Environment as `DATABASE_URL`.
    # Example (Neon): postgresql://USER:PASS@HOST/DB?sslmode=require
