<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111714" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111714" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trend Pilot" />
    
    <!-- Prevent automatic zooming on iOS -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- SEO & Sharing -->
    <title>Trend Pilot - AI Trading Assistant</title>
    <meta name="description" content="AI-powered trading analyzer delivering intelligent buy/sell recommendations for crypto, stocks, forex, commodities, and bonds markets." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trend Pilot - AI Trading Assistant" />
    <meta property="og:description" content="AI-powered trading analyzer delivering intelligent buy/sell recommendations for crypto, stocks, forex, commodities, and bonds markets." />
    <meta property="og:image" content="/favicon.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Trend Pilot - AI Trading Assistant" />
    <meta name="twitter:description" content="AI-powered trading analyzer delivering intelligent buy/sell recommendations for crypto, stocks, forex, commodities, and bonds markets." />
    
    <!-- Spline Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <!-- VERSION GUARD: Check before ANY cached code loads -->
    <script>
      (function() {
        const CURRENT_VERSION = '1.2.4'; // Will be server-injected in production
        const STORED_VERSION_KEY = 'app_version';
        
        async function checkVersion() {
          try {
            // Get stored version (from last successful load)
            const storedVersion = localStorage.getItem(STORED_VERSION_KEY);
            
            // Fetch current server version
            const response = await fetch('/api/version', {
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache' }
            });
            
            if (!response.ok) {
              console.warn('[VERSION] Could not check version, allowing load');
              return;
            }
            
            const data = await response.json();
            const serverVersion = data.version;
            
            console.log('[VERSION] Stored:', storedVersion, 'Server:', serverVersion);
            
            // If versions don't match, force update
            if (storedVersion && storedVersion !== serverVersion) {
              console.warn('[VERSION] Mismatch detected! Forcing update...');
              
              // Show updating message
              document.body.innerHTML = `
                <div style="
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  background: #111714;
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  font-family: 'Spline Sans', sans-serif;
                  color: white;
                  z-index: 999999;
                ">
                  <div style="
                    width: 64px;
                    height: 64px;
                    border: 4px solid #38e07b;
                    border-top-color: transparent;
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 24px;
                  "></div>
                  <h1 style="font-size: 24px; font-weight: bold; margin: 0 0 12px 0; color: #38e07b;">
                    Updating Trend Pilot
                  </h1>
                  <p style="font-size: 16px; color: #9eb7a8; margin: 0; text-align: center; max-width: 300px;">
                    Installing latest version (${serverVersion})...
                  </p>
                  <p style="font-size: 14px; color: #6a7f72; margin: 16px 0 0 0;">
                    This will only take a moment
                  </p>
                </div>
                <style>
                  @keyframes spin {
                    to { transform: rotate(360deg); }
                  }
                </style>
              `;
              
              // Force clear everything
              if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(r => r.unregister()));
              }
              
              if ('caches' in window) {
                const names = await caches.keys();
                await Promise.all(names.map(name => caches.delete(name)));
              }
              
              // Store new version and hard reload
              localStorage.setItem(STORED_VERSION_KEY, serverVersion);
              window.location.href = window.location.href.split('?')[0] + '?v=' + Date.now();
              
              // Prevent any further loading
              throw new Error('Version update in progress');
            }
            
            // Versions match or first load - store current version
            localStorage.setItem(STORED_VERSION_KEY, serverVersion);
            console.log('[VERSION] OK - allowing app to load');
            
          } catch (error) {
            if (error.message !== 'Version update in progress') {
              console.error('[VERSION] Check failed:', error);
            }
          }
        }
        
        // Run version check immediately before React loads
        checkVersion();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
