<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111714" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111714" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trend Pilot" />
    
    <!-- Prevent automatic zooming on iOS -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- SEO & Sharing -->
    <title>Trend Pilot - AI Trading Assistant</title>
    <meta name="description" content="AI-powered trading advisory tool delivering intelligent buy/sell recommendations for crypto, stocks, forex, commodities, and bonds markets." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trend Pilot - AI Trading Assistant" />
    <meta property="og:description" content="AI-powered trading advisory tool delivering intelligent buy/sell recommendations for crypto, stocks, forex, commodities, and bonds markets." />
    <meta property="og:image" content="/favicon.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Trend Pilot - AI Trading Assistant" />
    <meta name="twitter:description" content="AI-powered trading advisory tool delivering intelligent buy/sell recommendations for crypto, stocks, forex, commodities, and bonds markets." />
    
    <!-- Spline Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
